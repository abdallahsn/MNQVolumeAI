# Phase 1 defaults. Keep machine-specific input paths out of committed config.
input_path:
output_root: data/trade_tape
artifact_root: artifacts/phase1
batch_size: 250000
symbol_filters: []
tick_size: "0.25"
exchange_timezone: America/Chicago
session_start: "17:00:00"
session_end: "16:00:00"
rth_start: "08:30:00"
rth_end: "15:00:00"
invalid_row_policy: fail
overwrite: false
compression: zstd
target_parquet_file_size_mb: 128
target_rows_per_file: 500000
quarantine_sample_limit: 10000
partial_session_tolerance_minutes: 5
logging_level: INFO
